<title id="t">CampusGo — conceptual system blueprint</title><desc id="d">Frontend React and TypeScript communicate with a FastAPI service. The backend connects to PostgreSQL with PostGIS, routing and verification, and LangGraph agents with Ollama. This is a conceptual overview.</desc>
